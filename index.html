<div id="scrim" class="scrim" hidden></div>
<div id="kingdomPage" class="page">
<div class="page-top">
<header class="bar page-head">
  <button class="btn icon menu-btn" type="button" aria-label="Menu" aria-controls="side">☰</button>
  <h2 class="page-title" data-i18n="navKingdom">Kingdom</h2>
  <p class="page-desc" data-i18n="descKingdom"></p>
</header>
<header class="bar">
  <div class="bar-scroll">
  <button id="vsBtn" class="mode-sw" type="button" role="switch" aria-checked="false" hidden data-i18n-title="cmpDaysTip">
    <span class="mode-l" data-i18n="modeLabel">Chế độ</span>
    <span class="mode-a" data-i18n="modeNormal">Thường</span>
    <i class="mode-t" aria-hidden="true"></i>
    <span class="mode-b" data-i18n="cmpDays">So sánh</span>
  </button>
  </div>
  <label class="field grow qbox"><span class="sr" data-i18n="search">Search</span>
    <input id="q" type="search" autocomplete="off" data-i18n-ph="searchPh">
    <ul id="qsug" class="klist pop" role="listbox" hidden></ul></label>
</header>
<!-- always there, so switching the mode moves nothing below it -->
<div id="cmpBar" class="cmp-bar">
  <div id="cmpTags" class="x-tags"><span id="cmpChips" class="dv-slot"></span>
    <div class="field kpick">
    <button id="kingdom" class="kbtn" type="button" aria-haspopup="listbox" aria-expanded="false" aria-controls="kpop" aria-label="Kingdom"><span id="kingdomLbl">Kingdom</span></button>
    <div id="kpop" class="pop" hidden>
      <input id="kq" type="search" autocomplete="off" inputmode="numeric" data-i18n-ph="kSearchPh">
      <ul id="klist" class="klist" role="listbox"></ul>
    </div>
  </div>
  </div>
  <div class="field cmp-only"><select id="vs" aria-label="Scan"></select></div>
  <span class="mut cmp-only" aria-hidden="true">→</span>
  <div id="scanField" class="field" hidden><select id="scan" aria-label="Scan"></select></div>
</div>
<div id="kpis" class="kpis"></div>
<!-- what the table shows: filter, metrics, number format, order -->
<div class="bar tbl-bar">
  <label class="field"><span class="sr" data-i18n="minPower">Power</span>
    <select id="minPower" aria-label="Power"></select></label>
  <div class="tools">
    <button id="colsBtn" class="btn" type="button"><span data-i18n="columns">Chỉ số</span> <b id="colsCount" class="pill"></b></button>
    <button id="fmtBtn" class="btn" type="button" aria-pressed="true" data-i18n-title="fmtTip">1.2M</button>
    <button id="heatBtn" class="btn" type="button" aria-pressed="false" data-i18n="heat" data-i18n-title="heatTip">± TB</button>
  </div>
  <div id="sortBox" class="sort-box">
    <label><span data-i18n="sortBy">Sắp theo</span><select id="sortKey" aria-label="Sort"></select></label>
    <span class="sort-modes">
      <button id="sortValue" type="button" data-i18n="sortValue" data-i18n-title="sortValueTip">Giá trị</button>
      <button id="sortDelta" type="button">±</button>
    </span>
    <button id="sortDir" type="button" data-i18n-title="sortDirTip"></button>
  </div>
</div>
<div id="colChips" class="col-chips"></div>
<nav id="modes" class="modes" aria-label="View">
  <button type="button" data-mode="players" data-i18n="mPlayers">Người chơi</button>
  <button type="button" data-mode="alliances" data-i18n="mAlliances">Liên minh</button>
  <button type="button" data-mode="chart" data-i18n="mChart">Biểu đồ</button>
  <button type="button" id="allianceOff" class="al-tag" hidden></button>
  <span class="meta"><span id="count"></span><span id="crawled" class="mut"></span></span>
</nav>
</div>
<main id="grid" class="grid" tabindex="0" aria-label="Players">
  <div id="sizer" class="sizer">
    <div id="head" class="head" role="row"></div>
    <div id="body" class="body"></div>
  </div>
  <p id="empty" class="empty" hidden></p>
</main>
<section id="panel" class="panel" hidden></section>
</div>

<div id="comparePage" class="page" hidden>
<header class="bar">
  <button class="btn icon menu-btn" type="button" aria-label="Menu" aria-controls="side">☰</button>
  <h2 class="page-title" data-i18n="navCompare">So sánh</h2>
  <p class="page-desc" data-i18n="descCompare"></p>
</header>
<main id="cmp" class="cmp"></main>
</div>

<div id="dvPage" class="page" hidden>
<header class="bar">
  <button class="btn icon menu-btn" type="button" aria-label="Menu" aria-controls="side">☰</button>
  <h2 id="dvTitle" class="page-title"></h2>
  <p id="dvDesc" class="page-desc"></p>
</header>
<main id="dv" class="cmp dv"></main>
</div>

<dialog id="cols" class="dlg">
  <form method="dialog" class="dlg-in">
    <div class="dlg-top">
      <h2><span data-i18n="pickCols">Chọn chỉ số hiển thị</span> <b id="colsCount2" class="pill"></b></h2>
      <button class="btn icon" value="close" aria-label="Close">✕</button>
    </div>
    <input id="colsQ" type="search" autocomplete="off" data-i18n-ph="filterCols">
    <div class="dlg-acts">
      <button type="button" class="chip" data-act="all" data-i18n="all">Tất cả</button>
      <button type="button" class="chip" data-act="none" data-i18n="none">Bỏ hết</button>
      <button type="button" class="chip" data-act="def" data-i18n="defaults">Mặc định</button>
    </div>
    <div id="colsList" class="cols-list"></div>
  </form>
</dialog>
